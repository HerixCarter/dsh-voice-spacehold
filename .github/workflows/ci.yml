name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 语法检查
        run: |
          node --check lib/client.js
          node --check lib/index.js
          node --check tools/probe.cjs
      - name: 冒烟测试（假 DOM，不需要 DSH）
        run: node tools/smoke.mjs
